# CI 骨架期工作流（D-05~D-08 载体）
# - D-05：三平台全量矩阵并行（windows/ubuntu/macos runner）
# - D-06：触发 = push 到 master + 所有 PR（pull_request 不限分支）
# - D-07：每平台四项检查 ① analyze+format ② test ③ pana（独立 ubuntu job）④ native build
# - D-08：pana 用 --exit-code-threshold 设通过线（非满分级）
# 明确不含：publish 步骤、任何 secrets 引用、melos/第三方 pana 包装 action（研究 SotA 弃用清单）。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2" # 钉版本保证可复现（与本机验证环境一致）
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # format 门双轨化（02-RESEARCH Pitfall 1）：逐字区文件字节=上游 window_manager 0.5.2
      # （本包 LV3.13 tall-style 与上游 short-style 结构性冲突），豁免格式化；
      # 正名单只查新码区文件。逐字性由下方 verbatim-diff 步持续守护。
      - run: >-
          dart format --set-exit-if-changed --output=none
          test/channel_contract_test.dart
          example/lib/utils/window_event_logger.dart
          example/test/widget_test.dart
          example/lib/utils/mouse_passthrough_recovery.dart
          example/test/mouse_passthrough_recovery_test.dart
      - run: flutter test
      - name: Example recovery tests
        working-directory: example
        run: flutter test test/mouse_passthrough_recovery_test.dart
      # SC5 机器门（02-RESEARCH Open Q3 定案进 CI）：curl 官方 pub.dev archive 为对照源，
      # 16 个 Dart 文件零差；无托盘 home.dart 用固定摘要守护授权偏差，禁止静默放宽。
      - name: Verbatim diff vs upstream window_manager 0.5.2 (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/wm052
          curl -sL https://pub.dev/api/archives/window_manager-0.5.2.tar.gz | tar xz -C /tmp/wm052
          bash tool/verbatim_diff.sh /tmp/wm052
      # ④ native build：插件根的 windows/linux/ 是 library-only CMake 壳、macos/ 是 podspec，
      # 不能作为独立应用构建——编译宿主是 example/（上游 window_manager build.yml 同款
      # working-directory 做法）。Pitfall 3 CI 变体预防：全新 configure 可能不生成
      # example/build/native_assets/windows，INSTALL 步骤会因目录缺失报错，先 mkdir 兜底。
      - name: Pre-create native_assets dir (windows, Pitfall 3)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mkdir -p example/build/native_assets/windows
      - name: Native build (windows)
        if: matrix.os == 'windows-latest'
        working-directory: example
        run: flutter build windows --release
      - name: Install Linux toolchain deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Native build (linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: example
        run: flutter build linux --release
      - name: Native build (macos)
        if: matrix.os == 'macos-latest'
        working-directory: example
        run: flutter build macos --release

  # ③ pana 评分门：Pitfall 4——pana 0.23.x 的 sandbox 在 Windows 盘符路径必崩，仅进 ubuntu。
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - run: dart pub global activate pana
      # D-08 钉死机制（pana 语义：(max−granted) > threshold 才非零退出——基线本身
      # 通过，任何进一步降分即红）。Phase 1 基线 150/160 → threshold 10。
      # Phase 2 重钉（02-01 A3 首推验证，CI run 33906880498）：基线 140/160
      # → threshold = 160 − 140 = 20。两项已知扣分：① pubspec description 超 180
      # 字符建议长度（0/10，Phase 5 PUB-04 精简）② 逐字区 lib/src 文件不匹配
      # tall-style formatter（40/50，D-01/SC5 字节级 verbatim 的结构性代价——
      # pana 的 format 检查无豁免机制，格式化逐字区即毁 SC5，02-RESEARCH
      # Pitfall 1/Alternatives 已裁决豁免）。Phase 5 description 精简后按
      # WINDOWS.md #5 流程重钉为 160 − 新基线。
      - run: dart pub global run pana:pana --exit-code-threshold 20 .
