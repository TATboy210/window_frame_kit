# window_frame_kit CI (0.3.0).
# - checks: analyze + format + unit tests + native build + native gtest +
#   integration test on every desktop host that GitHub offers.
# - ubuntu-24.04-arm is intentionally absent: Flutter stable publishes no
#   Linux arm64 host SDK, so `flutter` cannot run there (README, "CI
#   coverage"). Linux arm64 apps still build from this source with a
#   self-provisioned SDK; that path is not verified by CI.
# - windows-11-arm runs the x64 SDK under emulation: analyze/test only, the
#   Windows arm64 desktop target is still experimental in Flutter.
# - beta: early warning for engine Windows-window changes, never blocking.
# No publish step and no secrets here; see publish.yml (tag-triggered OIDC).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            flutter-arch: x64
            build: true
          - os: windows-11-arm
            platform: windows
            flutter-arch: x64
            build: false
          - os: macos-latest # arm64
            platform: macos
            flutter-arch: arm64
            build: true
          - os: macos-15-intel
            platform: macos
            flutter-arch: x64
            build: true
          - os: ubuntu-latest
            platform: linux
            flutter-arch: x64
            build: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          architecture: ${{ matrix.flutter-arch }}
          cache: true
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev xvfb xfwm4 dbus-x11
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # Verbatim-ported files keep upstream formatting byte-for-byte; only
      # files owned by this package are format-gated.
      - name: Format (package-owned files)
        run: >-
          dart format --set-exit-if-changed --output=none
          lib/src/diagnostics
          lib/src/utils/calc_window_position.dart
          test/channel_contract_test.dart
          test/frame_kit_test.dart
          example/lib/utils/window_event_logger.dart
          example/lib/utils/mouse_passthrough_recovery.dart
          example/test
          example/integration_test/frame_kit_test.dart
      - run: flutter test --timeout 90s
      - name: Example widget tests
        working-directory: example
        run: flutter test --timeout 90s test
      - name: Verbatim diff vs upstream window_manager 0.5.2
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/wm052
          curl -sL https://pub.dev/api/archives/window_manager-0.5.2.tar.gz | tar xz -C /tmp/wm052
          bash tool/verbatim_diff.sh /tmp/wm052

      # --- native build + tests (example is the build host) ---
      - name: Pre-create native_assets dir (windows)
        if: matrix.platform == 'windows' && matrix.build
        shell: bash
        run: mkdir -p example/build/native_assets/windows
      - name: Native build
        if: matrix.build
        working-directory: example
        run: flutter build ${{ matrix.platform }} --release
      - name: Native frame-geometry tests (gtest)
        if: matrix.platform == 'windows' && matrix.build
        shell: bash
        run: example/build/windows/x64/plugins/window_frame_kit/Release/window_frame_kit_test.exe
      - name: Integration test (windows)
        if: matrix.platform == 'windows' && matrix.build
        working-directory: example
        run: flutter test integration_test/frame_kit_test.dart -d windows
      - name: Integration test (macos)
        if: matrix.platform == 'macos'
        working-directory: example
        env:
          WFK_SKIP_MACOS_FULLSCREEN: "1"
        run: flutter test integration_test/frame_kit_test.dart -d macos
      - name: Integration test (linux, xvfb + xfwm4)
        if: matrix.platform == 'linux'
        working-directory: example
        env:
          WFK_HAS_WM: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            xfwm4 --compositor=off >/dev/null 2>&1 &
            sleep 2
            flutter test integration_test/frame_kit_test.dart -d linux'

  beta:
    name: flutter beta (early warning)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true
      - run: flutter pub get
      # Report, don't gate: beta deprecations (e.g. material.dart moving to
      # material_ui) must not hide whether the native side still builds.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        shell: bash
      - run: flutter test --timeout 90s
      - shell: bash
        run: mkdir -p example/build/native_assets/windows
      - name: Native build
        working-directory: example
        run: flutter build windows --release
      - name: Integration test
        working-directory: example
        run: flutter test integration_test/frame_kit_test.dart -d windows

  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - run: dart pub global activate pana
      # Threshold 20: verbatim-ported lib/src files keep upstream formatting
      # (pana format check has no exemption) - see DEVIATIONS #2.
      - run: dart pub global run pana:pana --exit-code-threshold 20 .
